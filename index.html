<!DOCTYPE html>
<html lang="en" data-theme="deadline">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d11">
  <title>Daily Tasker</title>

  <!-- PWA -->
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="application-name" content="Daily Tasker">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Daily Tasker">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">

  <!-- Online fallback; self-hosted @font-face below guarantees the real type loads offline too. -->
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    /* ── Self-hosted fonts (variable, weight axis 100–900) ─────────────────── */
    @font-face{font-family:'Space Grotesk';font-style:normal;font-weight:100 900;font-display:swap;src:url('./fonts/spacegrotesk-1.woff2') format('woff2');unicode-range:U+0102-0103,U+0110-0111,U+0128-0129,U+0168-0169,U+01A0-01A1,U+01AF-01B0,U+0300-0301,U+0303-0304,U+0308-0309,U+0323,U+0329,U+1EA0-1EF9,U+20AB;}
    @font-face{font-family:'Space Grotesk';font-style:normal;font-weight:100 900;font-display:swap;src:url('./fonts/spacegrotesk-2.woff2') format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF;}
    @font-face{font-family:'Space Grotesk';font-style:normal;font-weight:100 900;font-display:swap;src:url('./fonts/spacegrotesk-3.woff2') format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;}
    @font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:100 900;font-display:swap;src:url('./fonts/jetbrainsmono-1.woff2') format('woff2');unicode-range:U+0460-052F,U+1C80-1C8A,U+20B4,U+2DE0-2DFF,U+A640-A69F,U+FE2E-FE2F;}
    @font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:100 900;font-display:swap;src:url('./fonts/jetbrainsmono-2.woff2') format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116;}
    @font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:100 900;font-display:swap;src:url('./fonts/jetbrainsmono-3.woff2') format('woff2');unicode-range:U+0370-0377,U+037A-037F,U+0384-038A,U+038C,U+038E-03A1,U+03A3-03FF;}
    @font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:100 900;font-display:swap;src:url('./fonts/jetbrainsmono-4.woff2') format('woff2');unicode-range:U+0102-0103,U+0110-0111,U+0128-0129,U+0168-0169,U+01A0-01A1,U+01AF-01B0,U+0300-0301,U+0303-0304,U+0308-0309,U+0323,U+0329,U+1EA0-1EF9,U+20AB;}
    @font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:100 900;font-display:swap;src:url('./fonts/jetbrainsmono-5.woff2') format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF;}
    @font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:100 900;font-display:swap;src:url('./fonts/jetbrainsmono-6.woff2') format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;}

    /* ── Theme tokens ──────────────────────────────────────────────────────── */
    :root, [data-theme="deadline"]{
      --bg:#0b0d11; --frame:#050608; --panel:#15181f; --panel2:#1c2029; --border:#272c36;
      --text:#eef1f6; --muted:#7e879a; --muted2:#aeb6c6;
      --accent:#5fe39a; --accent-ink:#07140c; --danger:#f2613f;
      --r-card:18px; --r-btn:14px; --r-badge:9px;
      --h-transform:none; --h-spacing:0; --h-weight:600; --btn-weight:600;
      --pulse:tfpulse; --page:#0e0f12;
    }
    [data-theme="orelse"]{
      --bg:#060607; --frame:#000; --panel:#111114; --panel2:#18181c; --border:#232327;
      --text:#f6f5f3; --muted:#74747a; --muted2:#b8b8bc;
      --accent:#f3b13c; --accent-ink:#1a1300; --danger:#ff453a;
      --r-card:14px; --r-btn:12px; --r-badge:7px;
      --h-transform:uppercase; --h-spacing:.04em; --h-weight:700; --btn-weight:700;
      --pulse:tfpulseB; --page:#000;
    }

    *,*::before,*::after{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0; background:var(--page); color:var(--text);
      font-family:'Space Grotesk',sans-serif;
      -webkit-font-smoothing:subpixel-antialiased; text-rendering:optimizeLegibility;
      display:flex; align-items:center; justify-content:center;
    }
    .mono{font-family:'JetBrains Mono',monospace}
    ::-webkit-scrollbar{width:0;height:0}
    button{font-family:inherit;cursor:pointer}
    input{font-family:inherit}

    @keyframes tfpulse{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(242,97,63,.35)}50%{transform:scale(1.06);box-shadow:0 0 0 18px rgba(242,97,63,0)}}
    @keyframes tfpulseB{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(255,69,58,.4)}50%{transform:scale(1.06);box-shadow:0 0 0 18px rgba(255,69,58,0)}}
    @keyframes pop{0%{transform:scale(.85);opacity:0}100%{transform:scale(1);opacity:1}}
    @keyframes slideup{0%{transform:translateY(8px);opacity:0}100%{transform:translateY(0);opacity:1}}

    /* ── App shell (phone on desktop, full-bleed on mobile) ────────────────── */
    .app{
      position:relative; width:100%; max-width:420px; height:100dvh; max-height:920px;
      background:var(--bg); color:var(--text); overflow:hidden;
      display:flex; flex-direction:column;
    }
    @media (min-width:460px) and (min-height:680px){
      .app{height:min(880px,96dvh); border-radius:42px; border:8px solid var(--frame);
        box-shadow:0 30px 70px rgba(0,0,0,.6), inset 0 0 0 1px var(--panel2)}
    }

    /* status bar */
    .statusbar{flex:none;display:flex;justify-content:space-between;align-items:center;
      padding:14px 22px 6px;font-size:12.5px;color:var(--muted)}
    .statusbar .left{display:flex;align-items:center;gap:8px}
    .streak-pill{display:flex;align-items:center;gap:6px;color:var(--accent)}
    .streak-dot{width:6px;height:6px;border-radius:50%;background:var(--accent)}
    .recover-badge{font-size:11px;color:var(--accent);opacity:.75;padding:3px 7px;border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);border-radius:20px}
    .iconbtn{background:transparent;border:none;color:var(--muted);padding:4px;display:flex;
      align-items:center;justify-content:center;border-radius:8px;line-height:0}
    .iconbtn:hover{color:var(--text)}
    .iconbtn.on{color:var(--accent)}
    .iconbtn svg{width:17px;height:17px;display:block}

    /* body / views */
    .stage{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
    .view{flex:1;min-height:0;display:flex;flex-direction:column}

    .head{padding:6px 22px 0;flex:none}
    .eyebrow{font-size:11px;letter-spacing:.14em;color:var(--muted)}
    .h1{font-size:27px;font-weight:var(--h-weight);margin-top:3px;color:var(--text);
      text-transform:var(--h-transform);letter-spacing:var(--h-spacing)}
    .chips{display:flex;gap:8px;margin-top:13px;flex-wrap:wrap}
    .chip{font-size:12px;border-radius:20px;padding:5px 11px;border:1px solid var(--border);
      background:var(--panel);color:var(--muted2)}
    .chip.good{color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent);
      border-color:color-mix(in srgb,var(--accent) 28%,transparent)}
    [data-theme="orelse"] .chip{border-radius:8px;font-family:'JetBrains Mono',monospace}

    /* task list */
    .list{flex:1;min-height:0;overflow-y:auto;padding:14px 16px 8px;display:flex;flex-direction:column;gap:9px}
    .task{background:var(--panel);border:1px solid var(--border);border-radius:var(--r-card);
      padding:13px 15px;display:flex;align-items:center;gap:12px;animation:slideup .18s ease both}
    .check{width:26px;height:26px;border-radius:calc(var(--r-badge) - 0px);border:1.5px solid #3a4150;
      flex:none;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--accent);
      background:transparent}
    [data-theme="orelse"] .check{border-color:#3a3a40;border-radius:7px}
    .check.done{background:color-mix(in srgb,var(--accent) 16%,transparent);border-color:color-mix(in srgb,var(--accent) 60%,transparent)}
    .task-main{flex:1;min-width:0}
    .task-title{font-size:14.5px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .task.done .task-title{color:var(--muted);text-decoration:line-through}
    .task.over .task-title{color:var(--danger);font-weight:600}
    .task.missed .task-title{color:var(--muted);text-decoration:line-through}
    .task-due{font-size:11.5px;color:var(--muted);margin-top:3px}
    .badge{font-size:13px;color:var(--muted2);background:var(--panel2);border:1px solid var(--border);
      border-radius:var(--r-badge);padding:5px 9px;flex:none}
    .badge.due{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--accent-ink);
      background:var(--danger);border-color:var(--danger);padding:6px 9px}
    .badge.missed{color:var(--muted);background:transparent}
    .del{background:transparent;border:none;color:var(--muted);opacity:.45;padding:2px 4px;font-size:15px;line-height:1;flex:none}
    .del:hover{opacity:1;color:var(--danger)}

    .empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
      text-align:center;color:var(--muted);padding:30px;gap:8px}
    .empty .big{font-size:17px;color:var(--text);font-weight:var(--h-weight)}

    /* footer / buttons */
    .footer{flex:none;padding:12px 16px 18px;display:flex;flex-direction:column;gap:9px}
    .btn{width:100%;border:none;border-radius:var(--r-btn);padding:15px;font-size:15px;
      font-weight:var(--btn-weight);background:var(--accent);color:var(--accent-ink);
      text-transform:var(--h-transform);letter-spacing:var(--h-spacing);font-family:'Space Grotesk',sans-serif}
    .btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--border);
      padding:13px;font-weight:500;text-transform:none;letter-spacing:0}
    .btn.danger-ghost{background:transparent;border:1px solid color-mix(in srgb,var(--danger) 50%,transparent);
      color:var(--danger);text-transform:none;letter-spacing:0;font-weight:500}
    .btn.neutral{background:var(--panel);border:1px solid var(--border);color:var(--text)}
    .btn:active{transform:translateY(1px)}

    /* add form */
    .form{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;padding:8px 22px 18px}
    .back{font-size:13px;color:var(--muted);background:none;border:none;padding:0;text-align:left;width:max-content}
    .label{font-size:11px;letter-spacing:.14em;color:var(--muted);margin-top:20px}
    .input{margin-top:8px;width:100%;background:var(--panel);border:1px solid var(--border);
      border-radius:var(--r-btn);padding:14px 16px;color:var(--text);font-size:15px;outline:none}
    .input:focus{border-color:color-mix(in srgb,var(--accent) 55%,var(--border))}
    .presets{display:flex;gap:8px;margin-top:8px}
    .preset{flex:1;background:var(--panel);color:var(--muted2);border:1px solid var(--border);
      border-radius:calc(var(--r-btn) - 2px);padding:12px 0;font-size:14px;font-family:'JetBrains Mono',monospace}
    .preset.sel{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
    .custom-row{display:flex;align-items:center;gap:8px;margin-top:8px}
    .custom-row input{width:90px}
    .custom-row span{font-size:12.5px;color:var(--muted)}
    .warn{margin-top:18px;background:color-mix(in srgb,var(--danger) 10%,transparent);
      border:1px solid color-mix(in srgb,var(--danger) 30%,transparent);border-radius:var(--r-btn);
      padding:12px 14px;display:flex;gap:10px;align-items:flex-start;font-size:12.5px;color:#c9a79b;line-height:1.45}
    .warn .d{width:8px;height:8px;border-radius:50%;background:var(--danger);margin-top:6px;flex:none}
    .warn b{color:var(--danger)}
    .grow{flex:1}

    /* overlays: alarm / done / penalty */
    .overlay{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;
      justify-content:center;padding:30px;text-align:center;animation:pop .2s ease both;z-index:5}
    .overlay.alarm{background-image:radial-gradient(circle at 50% 30%, color-mix(in srgb,var(--danger) 22%,transparent), var(--bg) 62%)}
    .overlay.done{background-image:radial-gradient(circle at 50% 28%, color-mix(in srgb,var(--accent) 16%,transparent), var(--bg) 64%)}
    .overlay.penalty{background-image:radial-gradient(circle at 50% 28%, color-mix(in srgb,var(--danger) 18%,transparent), var(--bg) 64%)}
    .ring{width:130px;height:130px;border-radius:50%;border:2px solid color-mix(in srgb,var(--danger) 45%,transparent);
      display:flex;align-items:center;justify-content:center;animation:var(--pulse) 1.1s ease-in-out infinite}
    .ring .core{width:96px;height:96px;border-radius:50%;background:var(--danger);display:flex;
      align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:20px;
      font-weight:700;color:#fff}
    .kicker{margin-top:26px;font-size:12px;letter-spacing:.22em;color:var(--danger);font-weight:700;font-family:'JetBrains Mono',monospace}
    .o-title{margin-top:10px;font-size:20px;font-weight:var(--h-weight);max-width:250px;
      text-transform:var(--h-transform);letter-spacing:var(--h-spacing)}
    .o-sub{margin-top:8px;font-size:13px;color:var(--muted)}
    .o-actions{margin-top:28px;width:100%;display:flex;flex-direction:column;gap:10px}
    .check-big{width:96px;height:96px;border-radius:50%;background:color-mix(in srgb,var(--accent) 14%,transparent);
      border:1.5px solid color-mix(in srgb,var(--accent) 50%,transparent);display:flex;align-items:center;
      justify-content:center;font-size:44px;color:var(--accent)}
    .o-h{font-size:22px;font-weight:var(--h-weight);margin-top:18px;text-transform:var(--h-transform);letter-spacing:var(--h-spacing)}
    .streak-num{font-family:'JetBrains Mono',monospace;font-size:52px;font-weight:700;color:var(--accent);line-height:1}
    .streak-cap{font-size:11px;letter-spacing:.16em;color:var(--muted);font-weight:600;text-align:left;line-height:1.3}
    .dots{display:flex;gap:6px;margin-top:16px;flex-wrap:wrap;justify-content:center;max-width:210px}
    .dots i{width:9px;height:9px;border-radius:50%;background:var(--accent)}
    .zero{font-family:'JetBrains Mono',monospace;font-size:84px;font-weight:700;color:var(--danger);line-height:1}
    .stat{display:flex;justify-content:space-between;background:var(--panel);border:1px solid var(--border);
      border-radius:calc(var(--r-btn) - 2px);padding:12px 14px;font-size:13px}
    .stat .k{color:var(--muted)}
    .stat .v{font-family:'JetBrains Mono',monospace}
    .strike{text-decoration:line-through;color:var(--muted2)}
    .toast{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);background:var(--panel);
      border:1px solid var(--border);color:var(--text);font-size:13px;padding:10px 16px;border-radius:999px;
      z-index:9;animation:slideup .2s ease both;white-space:nowrap}
  </style>
</head>
<body>
  <div id="app" class="app"></div>

<script>
"use strict";
(function () {
  const STORE_KEY = 'taskfinder.v2';
  const PRESETS = [15, 30, 60, 120]; // minutes

  // ── State ────────────────────────────────────────────────────────────────
  const defaultState = () => {
    const now = Date.now();
    return {
      theme: 'deadline',
      recoveryProgress: 0,
      alerts: true,
      streak: 0, best: 0, skips: 0, lastStreak: 0,
      view: 'list',                 // list | add
      draft: { title: '', min: 30, custom: '' },
      tasks: [
        { id: id(), title: 'Ship the pricing page',        deadline: now + 25 * 60000,  status: 'active' },
        { id: id(), title: 'Reply to the investor email',  deadline: now + 70 * 60000,  status: 'active' },
        { id: id(), title: 'Inbox to zero',                deadline: now - 5 * 60000,   status: 'done' },
        { id: id(), title: 'Gym — leg day',                deadline: now + 180 * 60000, status: 'active' },
      ],
    };
  };

  let state = load() || defaultState();

  // Transient (not persisted): the alarm currently on screen, and the result overlay.
  let ringingId = null;     // task being shown on the alarm screen
  let resultView = null;    // {kind:'done'|'penalty', taskId}

  function id() { return 'tf' + Math.random().toString(36).slice(2, 9); }

  function save() {
    try {
      const { view, draft, ...persist } = state; // don't persist transient nav/draft
      localStorage.setItem(STORE_KEY, JSON.stringify(persist));
    } catch (e) {}
  }
  function load() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (!raw) return null;
      const p = JSON.parse(raw);
      return Object.assign(defaultState(), p, { view: 'list', draft: { title: '', min: 30, custom: '' } });
    } catch (e) { return null; }
  }

  // ── Time helpers ───────────────────────────────────────────────────────────
  const pad = n => String(n).padStart(2, '0');
  const clockStr = ms => { const d = new Date(ms); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
  function remStr(ms) {
    if (ms <= 0) return 'NOW';
    const s = Math.floor(ms / 1000);
    if (s < 3600) return Math.floor(s / 60) + ':' + pad(s % 60);
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
    return h + 'h ' + m + 'm';
  }
  const dateLabel = ms => new Date(ms)
    .toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' }).toUpperCase();
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));

  // ── Sound + notifications ───────────────────────────────────────────────────
  let audioCtx = null, beepTimer = null;
  function unlockAudio() {
    if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }
  document.addEventListener('pointerdown', unlockAudio, { once: false });
  function beep() {
    if (!state.alerts || !audioCtx) return;
    try {
      const t = audioCtx.currentTime;
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'square'; o.frequency.value = 880;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.18, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.32);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t); o.stop(t + 0.34);
    } catch (e) {}
  }
  function startAlarmSound() { stopAlarmSound(); beep(); beepTimer = setInterval(beep, 900); }
  function stopAlarmSound() { if (beepTimer) { clearInterval(beepTimer); beepTimer = null; } }
  function notify(title) {
    if (!state.alerts) return;
    try { if ('vibrate' in navigator) navigator.vibrate([200, 100, 200]); } catch (e) {}
    try {
      if ('Notification' in window && Notification.permission === 'granted')
        new Notification("⏰ Time's up", { body: title });
    } catch (e) {}
  }
  function requestNotify() {
    try { if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission(); } catch (e) {}
  }

  // ── Mutations ───────────────────────────────────────────────────────────────
  function setView(v) { state.view = v; render(); }
  function setTheme(t) {
    state.theme = t;
    document.documentElement.setAttribute('data-theme', t);
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', t === 'orelse' ? '#060607' : '#0b0d11');
    save(); render();
  }
  function toggleAlerts() { state.alerts = !state.alerts; if (state.alerts) { unlockAudio(); requestNotify(); } else stopAlarmSound(); save(); render(); }

  function draftMinutes() {
    const c = parseFloat(state.draft.custom);
    return (state.draft.custom !== '' && !isNaN(c) && c > 0) ? c : state.draft.min;
  }
  function addTask() {
    const input = document.getElementById('title-input');
    const title = (input ? input.value : state.draft.title).trim();
    if (!title) { if (input) input.focus(); return; }
    const mins = draftMinutes();
    state.tasks.unshift({ id: id(), title, deadline: Date.now() + Math.round(mins * 60000), status: 'active' });
    state.draft = { title: '', min: 30, custom: '' };
    state.view = 'list';
    if (state.alerts) requestNotify();
    save(); render();
    toast('Alarm set for ' + remStr(mins * 60000) + ' from now');
  }
  function deleteTask(tid) {
    state.tasks = state.tasks.filter(t => t.id !== tid);
    if (ringingId === tid) { ringingId = null; stopAlarmSound(); }
    save(); render();
  }
  // Mark a task finished BEFORE its alarm — "beat the clock".
  function finishEarly(tid) {
    const t = state.tasks.find(x => x.id === tid);
    if (!t || t.status === 'done') return;
    t.status = 'done'; t.doneAt = Date.now();
    bumpStreak();
    resultView = { kind: 'done', taskId: tid };
    save(); render();
  }
  // Resolve the alarm that is currently ringing.
  function alarmFinished() {
    const t = state.tasks.find(x => x.id === ringingId);
    if (t) { t.status = 'done'; t.doneAt = Date.now(); }
    bumpStreak();
    stopAlarmSound();
    resultView = { kind: 'done', taskId: ringingId };
    ringingId = null;
    save(); render();
  }
  function alarmMissed() {
    const t = state.tasks.find(x => x.id === ringingId);
    if (t) t.status = 'missed';
    state.lastStreak = state.streak; state.streak = 0; state.skips += 1;
    // Switch to gold/orelse and reset recovery counter on any miss
    state.theme = 'orelse';
    state.recoveryProgress = 0;
    stopAlarmSound();
    resultView = { kind: 'penalty', taskId: ringingId };
    ringingId = null;
    save(); render();
  }
  function bumpStreak() {
    state.streak += 1;
    if (state.streak > state.best) state.best = state.streak;
    // Recovery: 2 consecutive successes while in gold mode restores green
    if (state.theme === 'orelse') {
      state.recoveryProgress += 1;
      if (state.recoveryProgress >= 2) {
        state.theme = 'deadline';
        state.recoveryProgress = 0;
      }
    }
  }
  function dismissResult() { resultView = null; render(); maybeRing(); }

  // Detect deadlines that have passed and put the first one on the alarm screen.
  function maybeRing() {
    if (ringingId || resultView) return;
    const now = Date.now();
    const due = state.tasks.find(t => t.status === 'active' && t.deadline <= now);
    if (due) {
      ringingId = due.id;
      unlockAudio(); startAlarmSound(); notify(due.title);
      render();
    }
  }

  // ── Rendering ────────────────────────────────────────────────────────────────
  function bell(on) {
    return on
      ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>'
      : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13.7 21a2 2 0 0 1-3.4 0"/><path d="M18.6 13A6 6 0 0 0 18 8M6 8a6 6 0 0 1 .6-2.6"/><path d="M3 3l18 18"/><path d="M5 8c0 7-3 9-3 9h13"/></svg>';
  }
  function statusbar() {
    const recoverBadge = (state.theme === 'orelse')
      ? '<span class="recover-badge mono">' + state.recoveryProgress + '/2 to green</span>'
      : '';
    return '<div class="statusbar">'
      + '<span class="mono">' + clockStr(Date.now()) + '</span>'
      + '<div class="left">'
        + '<button class="iconbtn ' + (state.alerts ? 'on' : '') + '" data-act="alerts" title="Alerts (sound + notification)">' + bell(state.alerts) + '</button>'
        + recoverBadge
        + '<span class="streak-pill mono">' + (state.theme === 'orelse'
            ? 'STREAK ' + state.streak
            : '<span class="streak-dot"></span>' + state.streak + ' day streak') + '</span>'
      + '</div></div>';
  }

  function taskRow(t) {
    const now = Date.now();
    const over = t.status === 'active' && t.deadline <= now;
    const cls = ['task', t.status === 'done' ? 'done' : '', over ? 'over' : '', t.status === 'missed' ? 'missed' : ''].join(' ');
    let badge = '';
    if (t.status === 'done') badge = '';
    else if (t.status === 'missed') badge = '<span class="badge missed mono">MISSED</span>';
    else if (over) badge = '<span class="badge due mono">DUE</span>';
    else badge = '<span class="badge mono" id="rem-' + t.id + '">' + remStr(t.deadline - now) + '</span>';
    return '<div class="' + cls + '">'
      + '<button class="check ' + (t.status === 'done' ? 'done' : '') + '" data-act="check" data-id="' + t.id + '">' + (t.status === 'done' ? '✓' : '') + '</button>'
      + '<div class="task-main">'
        + '<div class="task-title">' + esc(t.title) + '</div>'
        + '<div class="task-due mono">' + (t.status === 'missed' ? 'missed · was due ' : 'due ') + clockStr(t.deadline) + '</div>'
      + '</div>'
      + badge
      + '<button class="del" data-act="del" data-id="' + t.id + '" title="Delete">✕</button>'
      + '</div>';
  }

  function listView() {
    const now = Date.now();
    const done = state.tasks.filter(t => t.status === 'done').length;
    const togo = state.tasks.filter(t => t.status === 'active').length;
    const missed = state.tasks.filter(t => t.status === 'missed').length;
    const chips = '<div class="chips">'
      + '<span class="chip good">' + done + (state.theme === 'orelse' ? ' DONE' : ' done') + '</span>'
      + '<span class="chip">' + togo + (state.theme === 'orelse' ? ' LEFT' : ' to go') + '</span>'
      + (missed ? '<span class="chip">' + missed + (state.theme === 'orelse' ? ' MISSED' : ' missed') + '</span>' : '')
      + '</div>';

    const body = state.tasks.length
      ? '<div class="list">' + state.tasks.map(taskRow).join('') + '</div>'
      : '<div class="empty"><div class="big">No tasks yet</div><div>Add one and set its alarm. Beat the clock to grow your streak.</div></div>';

    return '<div class="view">'
      + '<div class="head"><div class="eyebrow mono">' + dateLabel(now) + '</div><div class="h1">Today</div>' + chips + '</div>'
      + body
      + '<div class="footer"><button class="btn" data-act="goadd">Add a task</button></div>'
      + '</div>';
  }

  function addView() {
    const d = state.draft;
    const customActive = d.custom !== '' && !isNaN(parseFloat(d.custom)) && parseFloat(d.custom) > 0;
    const presets = PRESETS.map(m => {
      const sel = !customActive && d.min === m;
      const label = m < 60 ? m + 'm' : (m / 60) + 'h';
      return '<button class="preset ' + (sel ? 'sel' : '') + '" data-act="preset" data-min="' + m + '">' + label + '</button>';
    }).join('');
    return '<div class="view"><div class="form">'
      + '<button class="back mono" data-act="goback">‹ back</button>'
      + '<div class="h1" style="font-size:22px;margin-top:14px">New task</div>'
      + '<div style="font-size:13px;color:var(--muted);margin-top:4px">Name it, then set the alarm.</div>'
      + '<div class="label mono">TASK</div>'
      + '<input id="title-input" class="input" placeholder="e.g. Finish the deck" value="' + esc(d.title) + '" />'
      + '<div class="label mono">FINISH WITHIN</div>'
      + '<div class="presets">' + presets + '</div>'
      + '<div class="custom-row"><input class="input mono" id="custom-input" inputmode="decimal" placeholder="—" value="' + esc(d.custom) + '" /><span>minutes (custom)</span></div>'
      + '<div class="warn"><div class="d"></div><div>' + (state.theme === 'orelse'
          ? 'Miss the alarm and your <b>streak burns to zero.</b> No snooze.'
          : 'If the alarm rings before you mark this done, your <b>streak resets to zero.</b>') + '</div></div>'
      + '<div class="grow"></div>'
      + '<button class="btn" data-act="add">Set the alarm</button>'
      + '</div></div>';
  }

  function alarmView() {
    const t = state.tasks.find(x => x.id === ringingId);
    const title = t ? t.title : '';
    return '<div class="overlay alarm">'
      + '<div class="ring"><div class="core">0:00</div></div>'
      + '<div class="kicker">' + (state.theme === 'orelse' ? "TIME'S UP" : 'ALARM') + '</div>'
      + '<div class="o-title">' + esc(title) + '</div>'
      + '<div class="o-sub">Deadline reached. Did you finish?</div>'
      + '<div class="o-actions">'
        + '<button class="btn" data-act="a-finish">I finished it</button>'
        + '<button class="btn danger-ghost" data-act="a-miss">I didn\'t make it</button>'
      + '</div></div>';
  }

  function doneView() {
    const dots = Array.from({ length: Math.min(state.streak, 14) }).map(() => '<i></i>').join('');
    return '<div class="overlay done">'
      + '<div class="check-big">✓</div>'
      + '<div class="o-h">Beat the clock</div>'
      + '<div class="o-sub">You finished before the alarm.</div>'
      + '<div style="margin-top:24px;display:flex;align-items:center;gap:10px">'
        + '<div class="streak-num">' + state.streak + '</div>'
        + '<div class="streak-cap">DAY<br>STREAK</div></div>'
      + '<div class="dots">' + dots + '</div>'
      + '<div class="o-actions"><button class="btn" data-act="dismiss">Back to today</button></div>'
      + '</div>';
  }

  function penaltyView() {
    return '<div class="overlay penalty">'
      + '<div class="zero">0</div>'
      + '<div class="o-h">' + (state.theme === 'orelse' ? 'Streak burned' : 'Streak broken') + '</div>'
      + '<div class="o-sub" style="max-width:260px">The alarm beat you. Your <span class="strike">' + state.lastStreak + '-day</span> streak is back to zero. Complete 2 tasks to go green again.</div>'
      + '<div style="margin-top:22px;width:100%;display:flex;flex-direction:column;gap:8px">'
        + '<div class="stat"><span class="k">Streak</span><span class="v" style="color:var(--danger)">0</span></div>'
        + '<div class="stat"><span class="k">Best streak</span><span class="v">' + state.best + '</span></div>'
        + '<div class="stat"><span class="k">Tasks missed</span><span class="v">' + state.skips + '</span></div>'
      + '</div>'
      + '<div class="o-actions"><button class="btn neutral" data-act="dismiss">Start again</button></div>'
      + '</div>';
  }

  let toastTimer = null;
  function toast(msg) {
    const old = document.querySelector('.toast'); if (old) old.remove();
    const el = document.createElement('div'); el.className = 'toast'; el.textContent = msg;
    document.getElementById('app').appendChild(el);
    clearTimeout(toastTimer); toastTimer = setTimeout(() => el.remove(), 2600);
  }

  function render() {
    document.documentElement.setAttribute('data-theme', state.theme);
    let main = state.view === 'add' ? addView() : listView();
    let overlay = '';
    if (ringingId) overlay = alarmView();
    else if (resultView && resultView.kind === 'done') overlay = doneView();
    else if (resultView && resultView.kind === 'penalty') overlay = penaltyView();
    document.getElementById('app').innerHTML = statusbar() + '<div class="stage">' + main + overlay + '</div>';
  }

  // ── Per-second tick: clocks, countdowns, fire alarms ─────────────────────────
  function tick() {
    const sb = document.querySelector('.statusbar .mono');
    if (sb) sb.textContent = clockStr(Date.now());
    const now = Date.now();
    let flip = false;
    if (state.view === 'list' && !ringingId && !resultView) {
      for (const t of state.tasks) {
        if (t.status !== 'active') continue;
        const ms = t.deadline - now;
        const el = document.getElementById('rem-' + t.id);
        if (ms > 0) { if (el) el.textContent = remStr(ms); }
        else { flip = true; } // just hit the deadline → needs the DUE badge / alarm
      }
    }
    if (flip) render();
    maybeRing();
  }

  // ── Events ───────────────────────────────────────────────────────────────────
  document.getElementById('app').addEventListener('click', e => {
    const btn = e.target.closest('[data-act]');
    if (!btn) return;
    const act = btn.dataset.act, tid = btn.dataset.id;
    switch (act) {
      case 'alerts':  toggleAlerts(); break;
      case 'goadd':   syncDraft(); setView('add'); break;
      case 'goback':  syncDraft(); setView('list'); break;
      case 'add':     addTask(); break;
      case 'preset':  syncDraft(); state.draft.min = +btn.dataset.min; state.draft.custom = ''; render(); break;
      case 'check':   finishEarly(tid); break;
      case 'del':     deleteTask(tid); break;
      case 'a-finish':alarmFinished(); break;
      case 'a-miss':  alarmMissed(); break;
      case 'dismiss': dismissResult(); break;
    }
  });
  // keep typed text when re-rendering the add screen
  document.getElementById('app').addEventListener('input', e => {
    if (e.target.id === 'title-input') state.draft.title = e.target.value;
    if (e.target.id === 'custom-input') { state.draft.custom = e.target.value; }
  });
  document.getElementById('app').addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.target.id === 'title-input') { e.preventDefault(); addTask(); }
  });
  function syncDraft() {
    const ti = document.getElementById('title-input'); if (ti) state.draft.title = ti.value;
    const ci = document.getElementById('custom-input'); if (ci) state.draft.custom = ci.value;
  }

  // ── Boot ─────────────────────────────────────────────────────────────────────
  document.documentElement.setAttribute('data-theme', state.theme);
  const _meta = document.querySelector('meta[name="theme-color"]');
  if (_meta) _meta.setAttribute('content', state.theme === 'orelse' ? '#060607' : '#0b0d11');
  render();
  maybeRing();
  setInterval(tick, 1000);
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(() => {}); });
  }
})();
</script>
</body>
</html>
